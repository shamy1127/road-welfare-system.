<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Complaint Details | Admin</title>

<link rel="stylesheet" href="css/dashboard.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>


<body>


<header class="navbar">

<div>

<h2>
🚧 Road Welfare Admin
</h2>

<p>
Complaint Details
</p>

</div>


<button onclick="location.href='admin.html'">

⬅ Back

</button>


</header>






<div class="dashboard-container">



<div class="complaint-layout">



<!-- ==========================================
LEFT SIDE
========================================== -->


<div class="complaint-main card">



<img 

id="complaintImage"

class="complaint-big-image"

style="display:none;">





<h1 id="complaintTitle">

Loading complaint...

</h1>





<div class="status-box">


<span>

Current Status

</span>



<strong id="status">

</strong>


</div>







<h3>

📝 Description

</h3>



<p 

id="complaintDescription"

class="description-text">

</p>







<div class="info-grid">



<div class="info-card">


<h4>

📂 Category

</h4>


<p id="category"></p>


</div>





<div class="info-card">


<h4>

📅 Date

</h4>


<p id="date"></p>


</div>



</div>






</div>









<!-- ==========================================
RIGHT SIDE
========================================== -->


<div class="complaint-side">





<!-- CITIZEN DETAILS -->

<div class="card">


<h2>

👤 Citizen Details

</h2>



<p>

<b>Name</b>

<br>

<span id="userName"></span>

</p>





<p>

<b>Email</b>

<br>

<span id="userEmail"></span>

</p>





<p>

<b>Phone</b>

<br>

<span id="userPhone"></span>

</p>



</div>









<!-- LOCATION -->

<div class="card">


<h2>

📍 Location

</h2>




<p id="address"></p>





<button id="mapButton">

🗺 Open Google Maps

</button>





<p>

Latitude:

<br>

<span id="latitude"></span>


</p>






<p>

Longitude:

<br>

<span id="longitude"></span>


</p>



</div>









<!-- ADMIN ACTIONS -->

<div class="card action-card">


<h2>

⚙ Admin Actions

</h2>





<select id="statusUpdate">


<option>

Pending

</option>



<option>

In Progress

</option>



<option>

Resolved

</option>



</select>







<button id="updateButton">

✅ Update Status

</button>







<button id="deleteButton" class="danger-btn">

🗑 Delete Complaint

</button>







<button id="downloadPdfButton">

📄 Download PDF

</button>





</div>






</div>






</div>



</div>









<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- PDF GENERATOR -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>



<script src="js/config.js"></script>

<script src="js/common.js"></script>

<script src="js/admin-complaint.js"></script>



</body>

</html>
