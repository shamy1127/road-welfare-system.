<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | Road Welfare System</title>

    <link rel="stylesheet" href="css/dashboard.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

    <!-- NAVBAR -->

    <header class="navbar">

        <div>

            <h2>👤 My Profile</h2>

            <p>Citizen Information</p>

        </div>

        <button onclick="window.location.href='user.html'">

            🏠 Dashboard

        </button>

    </header>

    <!-- PROFILE -->

    <div class="dashboard-container">

        <section class="user-profile-wrapper">

            <div class="user-profile-card">

                <!-- TOP -->

                <div class="user-profile-top">

                    <div class="profile-avatar">

                        <img id="profileImage" src="https://placehold.co/200x200?text=👤" alt="Profile Picture">

                        <label for="avatarInput" class="camera-btn">

                            📷

                        </label>

                        <input type="file" id="avatarInput" accept="image/*" hidden>

                    </div>

                    <h1 id="profileName">

                        Loading...

                    </h1>

                    <p id="profileEmail">

                        Loading...

                    </p>

                    <span class="user-badge">

                        VERIFIED CITIZEN

                    </span>

                </div>

                <!-- DETAILS -->

                <div class="user-details">

                    <div class="user-detail-card">

                        <span>
                            👤 Full Name
                        </span>

                        <strong id="infoName">

                            Loading...

                        </strong>

                    </div>

                    <div class="user-detail-card">

                        <span>
                            📧 Email
                        </span>

                        <strong id="infoEmail">

                            Loading...

                        </strong>

                    </div>

                    <div class="user-detail-card">

                        <span>
                            🆔 User ID
                        </span>

                        <strong id="infoId">

                            Loading...

                        </strong>

                    </div>

                    <div class="user-detail-card">

                        <span>
                            📅 Joined
                        </span>

                        <strong id="infoJoined">

                            Loading...

                        </strong>

                    </div>

                    <div class="user-detail-card">

                        <span>
                            📋 Reports
                        </span>

                        <strong id="totalReports">

                            0

                        </strong>

                    </div>

                    <div class="user-detail-card">

                        <span>
                            ✅ Resolved
                        </span>

                        <strong id="resolvedReports">

                            0

                        </strong>

                    </div>

                </div>

                <!-- ACHIEVEMENT -->

                <div class="achievement-card">

                    <div class="achievement-icon">

                        🏅

                    </div>

                    <div>

                        <h2>

                            Road Guardian

                        </h2>

                        <p>

                            Thank you for helping improve roads by reporting issues.

                        </p>

                    </div>

                </div>

                <!-- ACTIONS -->

                <div class="user-profile-actions">

                    <button id="editProfileBtn">

                        ✏ Edit Profile

                    </button>

                    <button id="changePasswordBtn">

                        🔒 Password

                    </button>

                    <button onclick="window.location.href='reports.html'">

                        📋 Reports

                    </button>

                </div>

            </div>

        </section>

    </div>

    <!-- Bottom Navigation -->

    <nav class="bottom-nav">

        <a href="user.html" class="nav-item">
            <span>🏠</span>
            <small>Dashboard</small>
        </a>

        <a href="reports.html" class="nav-item">
            <span>📋</span>
            <small>Reports</small>
        </a>

        <a href="profile.html" class="nav-item active">
            <span>👤</span>
            <small>Profile</small>
        </a>

    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/config.js"></script>

    <script src="js/common.js"></script>

    <script src="js/profile.js"></script>

    <script src="js/navigation.js"></script>

</body>

</html>
