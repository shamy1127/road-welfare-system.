📋 Complaints Management

Logout
</button>

<div class="dashboard-container">



<h1>
All Complaints
</h1>



<!-- SEARCH + FILTER -->


<div class="admin-filter-box">


<input

id="searchInput"

type="text"

placeholder="🔍 Search complaint, user, category..."

>



<select id="statusFilter">


<option value="All">
All Status
</option>


<option value="Pending">
Pending
</option>


<option value="In Progress">
In Progress
</option>


<option value="Resolved">
Resolved
</option>


</select>





<select id="categoryFilter">


<option value="All">
All Categories
</option>


<option value="Pothole">
Pothole
</option>


<option value="Broken Road">
Broken Road
</option>


<option value="Street Light">
Street Light
</option>


<option value="Traffic Signal">
Traffic Signal
</option>


<option value="Other">
Other
</option>


</select>



</div>







<div id="adminReports">


<div class="loading-box">


<h3>
Loading complaints...
</h3>


<p>
Fetching citizen reports
</p>


</div>


</div>



</div>
